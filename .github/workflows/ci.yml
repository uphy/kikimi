name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run obsolete. `main` is excluded from
# cancellation so every merged commit keeps a build result of its own.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # SwiftLint's pinned version lives in `mise.toml`, so CI and local runs cannot drift.
      - uses: jdx/mise-action@v4
        with:
          experimental: true

      - run: mise run lint

  # `web/` (docs/design/39-webview-markdown.md) holds the Markdown renderer. Without this job its
  # 55 tests and its type checking never run in CI: `mise run lint` skips the web typecheck when
  # node_modules is absent, which on a fresh runner it always is. The two bugs that slipped through
  # review on this layer (a swapped argument order across the Swift/JS bridge, and mermaid's SVG
  # sizing) both lived exactly here, so leaving it unguarded defeats the tests that exist.
  web:
    name: Web (typecheck & test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # Node's version lives in `mise.toml` for the same reason SwiftLint's does: CI and local runs
      # must not drift.
      - uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install
        run: npm ci --prefix web

      - name: Typecheck
        run: npm run typecheck --prefix web

      - name: Test
        run: npm test --prefix web

      # Proves the bundle the app actually ships can be produced -- a broken esbuild config would
      # otherwise only surface at `mise run build` time, on someone's machine.
      - name: Build bundle
        run: npm run build --prefix web

  test:
    name: Build & test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # `Package.resolved` is gitignored, so the cache key is the manifest itself. Every dependency
      # in it is pinned (`exact:`) or lower-bounded (`from:`), so a stale cache can only ever be a
      # miss on resolution, never a wrong build.
      #
      # `.build` is deliberately *not* cached. It bought nothing: `actions/checkout` gives every
      # source file a fresh mtime, so the compiler rebuilt the whole graph anyway (a restored run's
      # log still starts at `[3/22] Compiling _TestingInternals`) -- 36-43s of restore for zero
      # compile-time saving. It also actively breaks builds: `restore-keys` prefix-matches a cache
      # from a *different* dependency graph, and a `.build` still holding the swift-testing
      # package's `Testing.swiftmodule` fails every test file with "missing required module
      # '_TestingInternals'". The key prefix is bumped so those existing archives, which contain
      # `.build` and would restore it regardless of `path`, are never restored again.
      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-v2-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: swiftpm-v2-${{ runner.os }}-

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: |
          set -o pipefail
          swift build --build-tests 2>&1 | tee /tmp/kikimi-build.log

      - name: Test
        # Matches `mise run test`: the window suites order real panels in, and the flag keeps them
        # invisible and inert (`FloatingPanel.isUnobtrusive`). Harmless on a headless runner, and it
        # keeps CI exercising the same configuration a developer runs.
        run: |
          set -o pipefail
          KIKIMI_TEST_HIDDEN=1 swift test --skip-build 2>&1 | tee /tmp/kikimi-test.log

      # Even at this job's reduced log volume, a failed run is thousands of lines and the one line
      # naming the broken test sits somewhere in the middle -- finding it meant downloading the
      # archive and grepping. This lifts those lines onto the run page itself, so a red check can be
      # diagnosed without opening the log at all.
      #
      # `✘` also prefixes *skipped* tests, hence the `skipped:` exclusion: a suite with env-gated
      # tests (`KIKIMI_ASR_EVAL_DIR` and friends) would otherwise drown the real failure.
      - name: Summarize the failure
        if: failure()
        run: |
          summary="$(
            grep -hE '^(error|fatal error): |:[0-9]+(:[0-9]+)?: (error|fatal error): ' \
              /tmp/kikimi-build.log 2>/dev/null | head -30
            grep -hE 'recorded an issue at |✘ (Test|Suite) .* failed after ' \
              /tmp/kikimi-test.log 2>/dev/null | grep -v ' skipped: ' | head -50
          )" || true
          # A failure mode neither pattern knows about -- a runner that ran out of disk, a
          # `swift test` that dies before the reporter prints anything -- must still leave something
          # readable here rather than an empty box that sends you back to the raw log.
          if [ -z "$summary" ]; then
            summary="$(tail -n 40 /tmp/kikimi-test.log /tmp/kikimi-build.log 2>/dev/null)" || true
          fi
          {
            echo '## What failed'
            echo
            echo '```'
            echo "$summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
