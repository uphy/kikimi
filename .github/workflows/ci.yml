name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run obsolete. `main` is excluded from
# cancellation so every merged commit keeps a build result of its own.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # SwiftLint's pinned version lives in `mise.toml`, so CI and local runs cannot drift.
      - uses: jdx/mise-action@v4
        with:
          experimental: true

      - run: mise run lint

  test:
    name: Build & test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # `Package.resolved` is gitignored, so the cache key is the manifest itself. Every dependency
      # in it is pinned (`exact:`) or lower-bounded (`from:`), so a stale cache can only ever be a
      # miss on resolution, never a wrong build.
      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build
